services:
  idc-server:
    build: .
    image: independent-design-checker:0.16
    container_name: idc-server
    env_file:
      - .env
    environment:
      IDC_SERVER_HOST: 0.0.0.0
      IDC_SERVER_PORT: 8080
      IDC_SERVER_USE_WAITRESS: "1"
      IDC_SERVER_UPLOAD_DIR: /data/uploads
      IDC_SERVER_REPORT_DIR: /data/reports
      IDC_TESSERACT_CMD: /usr/bin/tesseract
      IDC_OCR_LANG: ${IDC_OCR_LANG:-eng}
      IDC_SERVER_MAX_UPLOAD_MB: ${IDC_SERVER_MAX_UPLOAD_MB:-200}
      IDC_SERVER_WORKERS: ${IDC_SERVER_WORKERS:-1}
    ports:
      - "${IDC_DOCKER_PORT:-8080}:8080"
    volumes:
      - idc_uploads:/data/uploads
      - idc_reports:/data/reports
    restart: unless-stopped

volumes:
  idc_uploads:
  idc_reports:
